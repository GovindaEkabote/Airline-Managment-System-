server:
  port: 8888

spring:
  application:
    name: config-server

  cloud:
    config:
      server:
        git:
          uri: https://github.com/GovindaEkabote/Airline-Config.git
          clone-on-start: true
          search-paths:
            - airline-config
          default-label: main

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: false

  instance:
    prefer-ip-address: true