
services:

  # Database
  user-service-db:
    image: mysql:8.0.33
    container_name: user-service-db
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "3306:3306"
    volumes:
      - user-service-db-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_user_db
      MYSQL_USER: airline_user
      MYSQL_PASSWORD: airline123
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Service Registry
  service-registry:
    image: govindaekabote/service-registry:1.0.0
    container_name: service-registry
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    ports:
      - "8761:8761"
    environment:
      SPRING_APPLICATION_NAME: service-registry
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # User Service
  user-service:
    image: govindaekabote/user-service:1.0.0
    container_name: user-service
    mem_limit: 512m
    mem_reservation: 256m
    cpus: 0.5
    depends_on:
      service-registry:
        condition: service_healthy
      user-service-db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: user-service
      SPRING_DATASOURCE_URL: jdbc:mysql://user-service-db:3306/airline_user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: airline_user
      SPRING_DATASOURCE_PASSWORD: airline123
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka/
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"

volumes:
  user-service-db-data:
