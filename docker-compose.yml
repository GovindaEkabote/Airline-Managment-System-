
services:

  # =====================================================
  # MYSQL DATABASES
  # =====================================================

  user-service-db:
    image: mysql:8.0.33
    container_name: user-service-db
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    ports:
      - "3309:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: airline_user_db
      MYSQL_USER: airline_user
      MYSQL_PASSWORD: airline123
    volumes:
      - user-service-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

